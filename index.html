<!-- Chosen Palette: Rose Pink & Soft Warm Neutrals -->
<!-- Application Structure Plan: Interactive text parser that applies medical aesthetic terminology transformation rules (Botox, Filler, Laser name replacements, number-to-currency formatting, and VIP/Petite membership protection) before structuring into a final customer SMS text. -->
<!-- Visualization & Content Choices: Pure JavaScript string transformation using Regular Expressions. Dynamic UI updating without external chart or SVG dependencies. -->
<!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원권 내역 정리 | 은빈S</title>

  <!-- Noto Sans KR 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff; 
      --primary: #f06292; 
      --primary-dark: #d81b60; 
      --primary-light: #fce4ec;
      --text: #333333;
      --card-bg: #ffffff;
      --border: rgba(240, 98, 146, 0.2);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
      --radius: 20px;
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      font-family: "Noto Sans KR", sans-serif !important;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px 20px;
      text-align: center;
      background: var(--primary-light); 
      border-bottom: 2px solid rgba(240, 98, 146, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(240, 98, 146, 0.05);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #333333;
      letter-spacing: -0.7px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
      width: 100%;
      flex: 1;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .option-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(240, 98, 146, 0.04);
      transition: all 0.2s ease;
      color: var(--text);
    }
    .option-pill:hover { border-color: var(--primary); transform: translateY(-1px); }
    .option-pill input { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }

    .actions { display: flex; gap: 10px; }

    .btn {
      border: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .btn-copy {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 15px rgba(240, 98, 146, 0.2);
    }
    .btn-copy:hover { 
      background: var(--primary-dark);
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(240, 98, 146, 0.25);
    }

    .btn-clear {
      background: #fff;
      color: #777;
      border: 1px solid #eee;
    }
    .btn-clear:hover { background: #fafafa; color: #444; border-color: #ddd; }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    @media (max-width: 850px) {
      .editor-grid { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
    }

    .panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }
    .panel:focus-within { border-color: var(--primary); box-shadow: 0 12px 30px rgba(240, 98, 146, 0.1); }

    .panel-header {
      padding: 16px 20px;
      background: #fff;
      border-bottom: 1px solid #f9f9f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title { font-size: 14px; font-weight: 700; color: #555; }

    .status-badge {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 700;
      border: 1px solid rgba(240, 98, 146, 0.1);
    }

    textarea {
      width: 100%;
      height: 520px;
      padding: 20px;
      border: none;
      resize: none;
      font-size: 14px;
      line-height: 1.8;
      background: transparent;
      outline: none;
      color: var(--text);
    }

    #output { background: #fdfdfd; color: #444; }

    .panel-footer {
      padding: 14px 20px;
      font-size: 12px;
      background: #fafafa;
      border-top: 1px solid #f5f5f5;
      color: #999;
    }

    footer {
      padding: 20px 0;
      text-align: center;
      font-size: 13px;
      color: #9e9e9e;
      letter-spacing: 0.3px;
      font-weight: 500;
      margin-top: 10px;
    }

    #toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
  <header>
    <h1>회원권 내역 문자 발송</h1>
  </header>

  <div class="container">
    <div class="toolbar">
      <div class="options">
        <label class="option-pill">
          <input type="checkbox" id="showMembership" checked>
          <span>보유 회원권 정보</span>
        </label>
        <label class="option-pill">
          <input type="checkbox" id="checkFilterN" checked>
          <span>'ㄴ' 필터링</span>
        </label>
        <label class="option-pill">
          <input type="checkbox" id="showPetitInfo">
          <span>쁘띠 가능시술 안내</span>
        </label>
      </div>
      <div class="actions">
        <button id="btnClear" class="btn btn-clear">CLEAR</button>
        <button id="btnCopy" class="btn btn-copy">결과 복사</button>
      </div>
    </div>

    <div class="editor-grid">
      <section class="panel">
        <div class="panel-header">
          <span class="panel-title">차트입력</span>
          <span id="inputStatus" class="status-badge">READY</span>
        </div>
        <textarea id="input" placeholder="차트 텍스트를 입력하세요"></textarea>
        <div class="panel-footer">
          회원권 정보, 차감항목, 잔액 등이 포함된 텍스트 입력
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <span class="panel-title">문자 발송용 변환결과</span>
          <span id="outputStatus" class="status-badge">WAITING</span>
        </div>
        <textarea id="output" placeholder="변환된 문구가 여기에 표시됩니다."></textarea>
        <div class="panel-footer" id="msgBox">
          데이터를 입력하면 문구가 자동으로 생성됩니다.
        </div>
      </section>
    </div>

    <footer>
      &copy; 2026. Designed & Developed by EUNBIN GA
    </footer>
  </div>

  <div id="toast">텍스트 복사 완료</div>

  <script>
    const elInput = document.getElementById('input');
    const elOutput = document.getElementById('output');
    const elShowMembership = document.getElementById('showMembership');
    const elCheckFilterN = document.getElementById('checkFilterN');
    const elShowPetitInfo = document.getElementById('showPetitInfo');
    const elBtnCopy = document.getElementById('btnCopy');
    const elBtnClear = document.getElementById('btnClear');
    const elToast = document.getElementById('toast');
    const elStatus = document.getElementById('inputStatus');
    const elOutStatus = document.getElementById('outputStatus');

    const btxKeywords = "승모근|이마|눈가|미간|콧등|눈썹위|눈썹산|자갈턱|종아리|허벅지|눈밑|입꼬리|사각턱|파워사각턱|측두근|턱|광대|보상근|침샘";
    const kwPattern = new RegExp(`(${btxKeywords}|스킨)\\s*(?:btx|b)\\b`, "gi");
    const autoBtxPattern = new RegExp(`(${btxKeywords})(?!\\s*보톡스)(?=\\s*(?:하이|비에|코어|리즈|메디|디스포트|제오민|엘러간|\\d))`, "gi");
    const fillerPattern = /(팔자|옆볼|눈밑고랑|눈밑|앞볼|미간|이마|관자|관자놀이|입술|애교|입꼬리|코|콧대|턱|턱끝|마리오넷|주름|볼)\s*f\b/gi;

    // 오늘 날짜 구하기 (yy.MM.dd 형식)
    function getToday() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    function transformText(line) {
      let v = line.trim();
      if (!v) return null;

      // 'ㄴ' 시작 라인 필터링
      if (elCheckFilterN && elCheckFilterN.checked && v.startsWith("ㄴ")) {
        if (!["하이쿡스", "팁", "1-1", "포함", "결제", "적립", "잔액", "잔여"].some(k => v.includes(k)) && !/\d{3,}/.test(v)) return null;
      }
      
      v = v.replace(/\b1-1\b/g, " ").replace(/\*마크뷰\+|\*마크뷰|마크뷰완료|마크뷰\+|마크뷰|\*마크\+|\*마\+|\*마크/g, "");
      if (["★", "원장님", "**", "특이사항", "이름", "내원경로", "~"].some(p => v.startsWith(p)) || v.includes("전화번호")) return null;
      
      v = v.replace(/인모드\s*(?:두가지|2가지)\s*(?:모드)?/g, "인모드 FX+FORMA");
      v = v.replace(/(?:엠마오|엠바오)\s*(?:마취)?\s*(?:크림)?/g, "특수 마취 크림 ");

      v = v
        .replace(/(?<!스텔라\s*)리써(?!FX)/gi, "스텔라 리써FX")
        .replace(/스텔라\s*IPL|IPL/gi, "스텔라 IPL")
        .replace(/(셀바|셀바이오|LDM)(?!이브)/gi, "셀바이브")
        .replace(/스보/g, "스킨보톡스")
        .replace(/브제/g, "브라질리언 제모")
        .replace(/에토좀\s*PTT|에토좀/gi, "에토좀 골드PTT")
        .replace(/엔바이론\s*이온자임|이온자임|엔바이론/gi, "엔바이론 이온자임")
        .replace(/오투덤\s*테라피|오투덤\s*산소테라피|오투덤|산소테라피/gi, "오투덤 산소테라피")
        .replace(/얼전|풀페이스|풀페/g, "얼굴전체")
        .replace(/겨제/g, "겨드랑이 제모")
        .replace(/ta/gi, "염증주사")
        .replace(/구득권/g, "구독권")
        .replace(/\bs[\.,]?\s*v\b/gi, "서비스");

      v = v
        .replace(autoBtxPattern, "$1보톡스")
        .replace(/비에녹스|(?<!엘라)비에|코어/gi, "국산 고순도")
        .replace(/(덴[서써]티)\s*하이/gi, "$1 High")
        .replace(/하이(?!쿡스)|리즈|메디/g, "국산일반");
      
      v = v.replace(/(VIP|vip|쁘(?:띠)?)\s?(\d+)\s?(?:전환)?\s?\(\s?(\d+)\s?(?:결제)?\s+(\d+)\s?(?:적립)?\s?\)/gi, (m, p1, p2, p3, p4) => `PROTECTED_${p1.toUpperCase().includes('VIP')?'VIP':'쁘띠회원권'}${p2}전환(${p3}만원 결제, ${p4}만원적립)`);
      v = v.replace(/(VIP|vip|쁘(?:띠)?)\s?(\d+)\s?\+\s?(\d+)(?:\([^)]*\))?/gi, (m, p1, p2, p3) => `PROTECTED_${p1.includes('쁘')?'쁘띠회원권':'VIP'}${p2}만원+${p3}만원 적립`);
      v = v.replace(/(?:잔액|잔여|잔금|잔|쁘잔)(?:\s|:|[-)>])+(\d{1,3}(?:[.,]\d{3})+|\d+)/g, (m, p1) => `PROTECTED_잔액 ${parseInt(p1.replace(/[.,]/g,""),10).toLocaleString()}원`);
      
      v = v.replace(kwPattern, "$1보톡스").replace(fillerPattern, "$1필러");
      
      v = v.replace(/(\d{1,3}(?:[.,]\d{3})+|\d{3,12})/g, (match, p1, offset, string) => {
        if (string.substring(0, offset).includes("PROTECTED_")) return match;
        if (/^\s*(?:샷|cc|u|unit|유닛|회|kj|J|분|줄|KJ|만|결제|적립|전환)/i.test(string.substring(offset+match.length))) return match;
        return parseInt(match.replace(/[.,]/g,""),10).toLocaleString() + "원";
      });
      
      return v.replace(/PROTECTED_/g, "").replace(/원원/g, "원").replace(/\s\s+/g, " ").trim();
    }

    function formatLine(line) {
      if (!line) return "";
      return line.trim()
        .replace(/1회차/g, "")
        .replace(/\b1-1\b/g, "")
        .replace(/(\d+)-1/g, "$1회")
        .replace(/\s+/g, " ")
        .trim();
    }

    function process() {
      const raw = elInput.value.trim();
      if (!raw) {
        elOutput.value = "";
        elStatus.textContent = "READY";
        elOutStatus.textContent = "WAITING";
        return;
      }

      const rawLines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l);
      const transformedLines = rawLines.map(transformText).filter(x => x !== null && x !== "");

      const today = getToday();
      let membership = "";
      let date = today;
      let usageItems = [];
      let total = "";
      let balance = "";

      // 원본 및 변환 라인 분석
      rawLines.forEach(line => {
        const membershipMatch = line.match(/\(([^/()]+)\/(\d{2}\.\d{2}\.\d{2})\)/);
        if (membershipMatch) {
          const buyDate = membershipMatch[2];
          date = buyDate;
          const namePart = line.replace(/\(([^/()]+)\/(\d{2}\.\d{2}\.\d{2})\)/, "").trim();
          const transformedName = transformText(namePart) || namePart;
          membership = `${transformedName}(${buyDate} 구매)`;
        }
      });

      transformedLines.forEach(line => {
        if (line.includes("구매)") && !membership) {
          membership = line;
          return;
        }
        if (line.startsWith("총")) {
          total = line;
          return;
        }
        if (line.includes("잔액:")) {
          balance = line;
          return;
        }
        if (line.startsWith("잔액 ")) {
          balance = line;
          return;
        }

        const cleaned = formatLine(line);
        if (cleaned && !cleaned.includes("구매)") && !cleaned.startsWith("잔액")) {
          if (!usageItems.includes(cleaned)) {
            usageItems.push(cleaned);
          }
        }
      });

      // 최종 SMS 조립
      let result = "안녕하세요! 오늘도 사랑스러운 블리비 홍대점입니다♡ 내원해주셔서 감사드리며 시술 내역 안내 드립니다.\n\n";

      if (elShowMembership.checked && membership) {
        result += `■보유 회원권\n${membership}\n\n`;
      }

      if (usageItems.length > 0) {
        result += `■ 내역(${date})\n`;
        usageItems.forEach(item => {
          result += `${item}\n`;
        });
        if (total) result += `${total}\n`;
        result += `※부가세 포함 금액\n\n`;
      }

      if (balance) {
        result += `■ `;
        result += `${balance}\n\n`;
      }

      if (elShowPetitInfo.checked) {
        result += `■ 쁘띠회원권 가능시술\n제모/보톡스/필러/인모드/슈링크 1회/실리프팅/점 사마귀 비립종 제거/면역수액주사/윤곽주사/블리비V주사/블리비S주사\n\n`;
      }

      result += `오늘도 사랑스럽고 행복한 하루 보내세요♡ 감사합니다.\n\n`;
      result += `■ 문의 및 예약\n카카오톡 > 블리비의원 홍대\n전화문의 > 1833-2141`;

      elOutput.value = result;
      elStatus.textContent = "DONE";
      elOutStatus.textContent = "COMPLETED";
    }

    function showToast(msg) {
      elToast.textContent = msg;
      elToast.classList.add('show');
      setTimeout(() => elToast.classList.remove('show'), 2000);
    }

    elBtnCopy.addEventListener('click', () => {
      if (!elOutput.value) return;
      elOutput.select();
      try {
        navigator.clipboard.writeText(elOutput.value).then(() => {
          showToast("텍스트 복사 완료");
        }).catch(() => {
          document.execCommand('copy');
          showToast("텍스트 복사 완료");
        });
      } catch (err) {
        showToast("복사 실패");
      }
    });

    elBtnClear.addEventListener('click', () => {
      elInput.value = "";
      process();
      elInput.focus();
    });

    elInput.addEventListener('input', process);
    elShowMembership.addEventListener('change', process);
    if (elCheckFilterN) elCheckFilterN.addEventListener('change', process);
    elShowPetitInfo.addEventListener('change', process);

    process();
  </script>
</body>
</html>
